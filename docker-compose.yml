services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golang_postgresql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: golang_postgresql
      DB_SSLMODE: disable
    command: ["migrate", "up"]

  seed:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: golang_postgresql
      DB_SSLMODE: disable
    command: ["seed", "1000000"]

  app:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: golang_postgresql
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    command: ["serve"]
